<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173f3a" />
    <meta name="description" content="ELC영어공부방 학부모 이메일 회원가입" />
    <title>회원가입 | ELC영어공부방</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=Noto+Serif+KR:wght@600;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/auth/auth.css" />
    <link rel="stylesheet" href="/auth/auth-nav.css" />
    <script src="/auth/auth-page.js" type="module"></script>
  </head>
  <body>
    <header class="auth-header">
      <a class="brand" href="/" aria-label="ELC영어공부방 첫 화면으로"><span class="brand-seal" aria-hidden="true">ELC</span><span class="brand-copy"><strong>ELC영어공부방</strong><small>Middle School English</small></span></a>
      <nav class="auth-nav" aria-label="계정 메뉴" data-auth-nav><a href="/login/">로그인</a><a href="/signup/" aria-current="page">회원가입</a></nav>
    </header>
    <main class="auth-main">
      <section class="auth-intro"><p class="eyebrow">Parent Account</p><h1>아이의 학습을<br />함께 살펴보세요.</h1><p>학부모 이메일로 계정을 만들면 상담과 자녀 정보를 한곳에서 관리할 수 있는 기반이 마련됩니다.</p></section>
      <section class="auth-card" aria-labelledby="signup-title">
        <h2 id="signup-title">이메일 회원가입</h2>
        <form class="auth-form" data-auth-form="signup">
          <label>이메일<input name="email" type="email" autocomplete="email" maxlength="120" required /></label>
          <label>비밀번호<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required /></label>
          <label>비밀번호 확인<input name="passwordConfirmation" type="password" autocomplete="new-password" minlength="8" maxlength="72" required /></label>
          <button type="submit">회원가입</button>
        </form>
        <p class="auth-status" role="status" aria-live="polite" data-auth-status></p>
        <p class="auth-switch">이미 계정이 있나요? <a href="/login/">로그인</a></p>
      </section>
    </main>
  </body>
</html>
