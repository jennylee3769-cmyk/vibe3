<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173f3a" />
    <meta name="description" content="ELC영어공부방 학부모 이메일 로그인" />
    <title>로그인 | ELC영어공부방</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=Noto+Serif+KR:wght@600;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/auth/auth.css" />
    <link rel="stylesheet" href="/auth/auth-nav.css" />
    <script src="/auth/auth-page.js" type="module"></script>
  </head>
  <body>
    <header class="auth-header">
      <a class="brand" href="/" aria-label="ELC영어공부방 첫 화면으로"><span class="brand-seal" aria-hidden="true">ELC</span><span class="brand-copy"><strong>ELC영어공부방</strong><small>Middle School English</small></span></a>
      <nav class="auth-nav" aria-label="계정 메뉴" data-auth-nav><a href="/login/" aria-current="page">로그인</a><a href="/signup/">회원가입</a></nav>
    </header>
    <main class="auth-main">
      <section class="auth-intro"><p class="eyebrow">Welcome Back</p><h1>다시 만나서<br />반갑습니다.</h1><p>가입한 학부모 이메일과 비밀번호를 입력해 주세요. 로그인 후 요청했던 화면으로 이어집니다.</p></section>
      <section class="auth-card" aria-labelledby="login-title">
        <h2 id="login-title">이메일 로그인</h2>
        <form class="auth-form" data-auth-form="login">
          <label>이메일<input name="email" type="email" autocomplete="email" maxlength="120" required /></label>
          <label>비밀번호<input name="password" type="password" autocomplete="current-password" minlength="8" maxlength="72" required /></label>
          <button type="submit">로그인</button>
        </form>
        <p class="auth-status" role="status" aria-live="polite" data-auth-status></p>
        <p class="auth-switch">처음 방문하셨나요? <a href="/signup/">회원가입</a></p>
      </section>
    </main>
  </body>
</html>
