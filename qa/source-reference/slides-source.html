<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" sizes="32x32" href="../favicon-32.png"><link rel="icon" sizes="192x192" href="../favicon-192.png"><link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>body{margin:0}</style>
</head><body>
<title>코덱스 바이브 코딩 실습 슬라이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;900&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">

<style>
:root {
  --ink:#111a2b; --ink-2:#1c2942;
  --paper:#edf0f4; --paper-2:#ffffff;
  --muted:#5a6478; --rule:#d3d9e2;
  --mark:#ffd400; --mark-soft:#fff2a8;
  --warn:#c0392f; --warn-bg:#fbe9e7;
  --ok:#1a7f57; --ok-bg:#e6f4ee;
  --code-bg:#111a2b; --code-fg:#e9edf4;
  --fg:var(--ink); --fg-muted:var(--muted);
  --bg:var(--paper); --surface:var(--paper-2); --border:var(--rule);
  --display:"Gothic A1","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono","D2Coding",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fg:#e6eaf1; --fg-muted:#98a3b7;
    --bg:#0b1220; --surface:#141d30; --border:#2a3549;
    --warn:#ff8d7d; --warn-bg:#2c1a1a;
    --ok:#5fd7a5; --ok-bg:#10291f;
    --mark-soft:#4a4310; --code-bg:#050a14; --code-fg:#e9edf4;
  }
}
:root[data-theme="dark"] {
  --fg:#e6eaf1; --fg-muted:#98a3b7;
  --bg:#0b1220; --surface:#141d30; --border:#2a3549;
  --warn:#ff8d7d; --warn-bg:#2c1a1a;
  --ok:#5fd7a5; --ok-bg:#10291f;
  --mark-soft:#4a4310; --code-bg:#050a14; --code-fg:#e9edf4;
}

* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--body); -webkit-font-smoothing:antialiased; }

/* 1fr 은 minmax(auto,1fr) 이라 최소 폭이 콘텐츠로 잡힌다.
   minmax(0,1fr) 로 두어야 좁은 화면에서 열이 밀려나지 않는다. */
.deck { height:100dvh; display:grid; grid-template-columns:84px minmax(0,1fr); grid-template-rows:1fr auto; }
.rail { grid-row:1/3; border-right:1px solid var(--border); background:var(--surface);
  display:flex; flex-direction:column; align-items:center; gap:9px; padding:20px 0; }
.rail-label { font-family:var(--mono); font-size:10px; letter-spacing:.16em; color:var(--fg-muted);
  writing-mode:vertical-rl; margin-top:auto; }
.pill { width:44px; height:44px; border:1px solid var(--border); border-radius:50%; background:transparent;
  color:var(--fg-muted); font-family:var(--display); font-weight:700; font-size:16px; cursor:pointer;
  transition:background .15s,color .15s,border-color .15s; }
.pill:hover { border-color:var(--fg); color:var(--fg); }
.pill[aria-current="true"] { background:var(--mark); border-color:var(--mark); color:#111a2b; }
.pill:focus-visible, .nav button:focus-visible, .copy:focus-visible, .ov-item:focus-visible {
  outline:3px solid var(--mark); outline-offset:3px; }

/* grid 로 두어야 자식이 열 폭을 그대로 받는다.
   flex 행에서는 자식이 콘텐츠 폭까지 줄어들어 제목이 불필요하게 두 줄로 깨졌다. */
.stage { overflow-y:auto; display:grid; grid-template-columns:minmax(0,1fr);
  align-content:center; padding:clamp(24px,4vw,60px);
  /* 그리드 아이템의 기본 min-width:auto 를 풀지 않으면 좁은 화면에서
     내용이 열을 밀어내 가로 스크롤이 생긴다. */
  min-width:0; }
.slide { width:100%; max-width:1240px; margin:0 auto; display:flex; flex-direction:column; gap:clamp(15px,2vw,26px); }

.eyebrow { font-family:var(--body); font-weight:600; font-size:clamp(13px,1.15vw,16px);
  letter-spacing:.02em; color:var(--fg-muted); display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:0; }
.time, .where { font-family:var(--mono); font-size:.82em; border:1px solid var(--border);
  border-radius:999px; padding:2px 11px; font-variant-numeric:tabular-nums; }
.where { background:var(--mark-soft); border-color:transparent; color:var(--fg); }

h1 { font-family:var(--display); font-weight:900; font-size:clamp(34px,5vw,72px); line-height:1.06;
  letter-spacing:-.025em; margin:0; text-wrap:balance; }
h2 { font-family:var(--display); font-weight:900; font-size:clamp(26px,3.6vw,46px); line-height:1.14;
  letter-spacing:-.015em; margin:0; text-wrap:balance; }
.lead { font-size:clamp(16px,1.55vw,21px); line-height:1.62; color:var(--fg-muted); max-width:64ch; margin:0; }
.say { font-size:clamp(19px,2vw,30px); line-height:1.55; max-width:30ch; margin:0; font-weight:500; text-wrap:balance; }

mark { background:linear-gradient(104deg,transparent .3%,var(--mark-soft) 1.4%,var(--mark-soft) 97%,transparent 99%);
  color:inherit; padding:0 .18em; border-radius:2px; box-decoration-break:clone; -webkit-box-decoration-break:clone; }

kbd { font-family:var(--body); font-weight:600; font-size:.92em; background:var(--surface);
  border:1px solid var(--border); border-bottom-width:2px; border-radius:5px; padding:1px 7px; white-space:nowrap; }
.val { font-family:var(--mono); font-size:.9em; background:var(--mark-soft); color:var(--fg);
  padding:1px 7px; border-radius:4px; }

.cover { gap:clamp(18px,2.6vw,34px); }
.cover-no { font-family:var(--display); font-weight:900; font-size:clamp(88px,18vw,220px);
  line-height:.8; letter-spacing:-.05em; color:var(--mark); }
/* 표지의 약속 문장은 한 줄로 읽히는 것이 강하다.
   ch 기준 폭 제한은 한글에서 지나치게 좁아 두 줄로 깨져서 걷어냈다. */
.promise { border-left:5px solid var(--mark); padding:4px 0 4px 18px; font-size:clamp(16px,1.55vw,22px);
  line-height:1.5; font-weight:500; max-width:100%; text-wrap:pretty; }

/* 단계 슬라이드 */
.do { display:grid; grid-template-columns:1fr; gap:18px; }
@media (min-width:1000px) { .do.two { grid-template-columns:1.35fr 1fr; gap:28px; } }
.steps { display:flex; flex-direction:column; gap:11px; margin:0; padding:0; list-style:none; counter-reset:st; }
.steps li { display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:baseline;
  font-size:clamp(15px,1.4vw,20px); line-height:1.55; }
.steps li::before { counter-increment:st; content:counter(st); font-family:var(--mono); font-weight:600;
  font-size:.8em; color:var(--fg); background:var(--mark); width:1.9em; height:1.9em; border-radius:50%;
  display:grid; place-items:center; font-variant-numeric:tabular-nums; }
.steps li small { display:block; color:var(--fg-muted); font-size:.82em; margin-top:2px; line-height:1.5; }
.side { display:flex; flex-direction:column; gap:14px; }
.box-ok, .box-no { border-radius:10px; padding:16px 18px; font-size:clamp(14px,1.25vw,17px); line-height:1.6; }
.box-ok { background:var(--ok-bg); border-left:5px solid var(--ok); }
.box-no { background:var(--warn-bg); border-left:5px solid var(--warn); }
.box-ok h4, .box-no h4 { margin:0 0 7px; font-family:var(--display); font-weight:700; font-size:clamp(14px,1.2vw,17px); }
.box-ok h4 { color:var(--ok); } .box-no h4 { color:var(--warn); }
.box-no dl { margin:0; display:grid; gap:8px; }
.box-no dt { font-weight:600; }
.box-no dd { margin:2px 0 0; color:var(--fg-muted); }

.rows { display:flex; flex-direction:column; gap:11px; }
.row { display:grid; grid-template-columns:auto 1fr; gap:16px; align-items:baseline;
  border-bottom:1px solid var(--border); padding-bottom:11px; font-size:clamp(15px,1.35vw,20px); line-height:1.5; }
.row:last-child { border-bottom:0; }
.row .k { font-family:var(--mono); font-size:clamp(12px,1.05vw,15px); color:var(--fg-muted);
  font-variant-numeric:tabular-nums; white-space:nowrap; }
.row .k.step { font-family:var(--display); font-weight:900; font-size:clamp(19px,1.9vw,28px); color:var(--mark); min-width:1.4em; }
.row .v small { display:block; color:var(--fg-muted); font-size:.82em; margin-top:3px; line-height:1.5; }

.cards { display:grid; gap:13px; grid-template-columns:repeat(auto-fit,minmax(225px,1fr)); }
.card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:18px;
  display:flex; flex-direction:column; gap:7px; }
.card h3 { margin:0; font-family:var(--display); font-weight:700; font-size:clamp(15px,1.4vw,20px); }
.card p { margin:0; font-size:clamp(13px,1.15vw,16px); line-height:1.55; color:var(--fg-muted); }

/* 코드/프롬프트 */
.block { position:relative; }
.prompt { background:var(--code-bg); color:var(--code-fg); border:1px solid var(--ink-2);
  border-top:4px solid var(--mark); border-radius:8px; padding:clamp(16px,1.9vw,26px);
  padding-right:110px; font-family:var(--mono); font-size:clamp(12.5px,1.08vw,16px); line-height:1.7;
  white-space:pre-wrap; overflow-x:auto; max-height:52vh; overflow-y:auto; margin:0; }
.prompt b { color:var(--mark); font-weight:600; }
.prompt.cmd { border-top-color:var(--ok); }
.copy { position:absolute; top:12px; right:12px; z-index:2; font-family:var(--body); font-weight:600;
  font-size:13px; padding:7px 13px; border-radius:6px; border:1px solid #38445c; background:#1c2942;
  color:#e9edf4; cursor:pointer; }
.copy:hover { background:#25344f; }
.copy[data-done="1"] { background:var(--mark); border-color:var(--mark); color:#111a2b; }

.checks { display:flex; flex-direction:column; gap:12px; }
.check { display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:center;
  font-size:clamp(16px,1.45vw,21px); line-height:1.45; }
.box { width:25px; height:25px; border:2.5px solid var(--fg); border-radius:4px; }

.warn { background:var(--warn-bg); border-left:5px solid var(--warn); border-radius:8px;
  padding:15px 19px; font-size:clamp(14px,1.25vw,18px); line-height:1.6; }
.warn b { color:var(--warn); }

/* 하단 바 */
.bar { border-top:1px solid var(--border); background:var(--surface); display:flex; align-items:center;
  gap:16px; padding:10px 20px; font-family:var(--mono); font-size:12px; color:var(--fg-muted);
  flex-wrap:wrap; }
.progress { min-width:60px; }
.progress { flex:1; height:5px; background:var(--border); border-radius:3px; overflow:hidden; }
.progress i { display:block; height:100%; background:var(--mark); width:0; transition:width .25s ease; }
.nav { display:flex; gap:6px; }
.nav button { border:1px solid var(--border); background:transparent; color:var(--fg); font-family:var(--mono);
  font-size:13px; height:30px; min-width:34px; padding:0 8px; cursor:pointer; border-radius:5px; }
.nav button:hover { border-color:var(--fg); }
.count { font-variant-numeric:tabular-nums; white-space:nowrap; }
.clock { font-variant-numeric:tabular-nums; white-space:nowrap; display:flex; align-items:center; gap:7px; }
.clock b { font-weight:600; color:var(--fg); font-size:13px; }
.clock .plan { color:var(--fg-muted); }
.clock[data-late="1"] b { color:var(--warn); }
.clock[data-run="0"] b { opacity:.45; }

.note { margin-top:6px; border:1px dashed var(--border); border-left:4px solid var(--mark);
  border-radius:9px; background:var(--surface); padding:15px 18px; }
.note[hidden] { display:none; }
.note-tag { font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; color:var(--fg-muted);
  display:block; margin-bottom:8px; }
.note p { margin:0 0 8px; font-size:clamp(14px,1.2vw,17px); line-height:1.62; }
.note p:last-child { margin-bottom:0; }
.note .say-line { border-left:3px solid var(--mark); padding-left:11px; font-weight:500; }
.note .act { color:var(--fg-muted); }
.hint { display:none; }
@media (min-width:1000px) { .hint { display:inline; } }

/* 목차 오버레이 */
.ov { position:fixed; inset:0; background:var(--bg); z-index:50; overflow-y:auto; padding:28px; }
.ov[hidden] { display:none; }
.ov h2 { margin-bottom:18px; }
.ov-group { margin-bottom:26px; }
.ov-group h3 { font-family:var(--display); font-weight:700; font-size:17px; color:var(--fg-muted);
  margin:0 0 10px; padding-bottom:7px; border-bottom:1px solid var(--border); }
.ov-list { display:grid; gap:7px; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); }
.ov-item { text-align:left; border:1px solid var(--border); background:var(--surface); border-radius:7px;
  padding:10px 13px; cursor:pointer; font-family:var(--body); font-size:14px; color:var(--fg);
  display:grid; grid-template-columns:auto 1fr; gap:11px; align-items:baseline; }
.ov-item:hover { border-color:var(--mark); }
.ov-item span { font-family:var(--mono); font-size:11.5px; color:var(--fg-muted); font-variant-numeric:tabular-nums; }

@media (max-width:720px) {
  .deck { grid-template-columns:52px minmax(0,1fr); }
  /* 좁은 화면에서는 하단 바가 넘치지 않도록 여백과 버튼을 줄인다 */
  .bar { gap:10px; padding:9px 12px; }
  .nav button { min-width:30px; height:28px; padding:0 6px; }
  .clock .plan { display:none; }
  .pill { width:34px; height:34px; font-size:13px; }
  .rail-label { display:none; }
  .prompt { padding-right:clamp(16px,1.9vw,26px); padding-top:52px; }
}
@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>

<div class="deck">
  <nav class="rail" aria-label="회차 이동">
    <button class="pill" data-jump="0" title="시작">·</button>
    <button class="pill" data-jump="1">1</button>
    <button class="pill" data-jump="2">2</button>
    <button class="pill" data-jump="3">3</button>
    <button class="pill" data-jump="4">4</button>
    <button class="pill" data-jump="5">5</button>
    <span class="rail-label">CODEX VIBE CODING</span>
  </nav>
  <main class="stage" id="stage" tabindex="-1"></main>
  <div class="bar">
    <span class="count" id="count">1 / 1</span>
    <span class="progress"><i id="bar"></i></span>
    <span class="clock" id="clock" data-run="0"><b id="elapsed">00:00</b><span class="plan" id="plan"></span></span>
    <span class="hint">← → 이동 · 1~5 회차 · O 목차 · N 강사노트 · T 타이머</span>
    <span class="nav">
      <button id="notes" aria-label="강사 노트 켜기/끄기">노트</button>
      <button id="toc" aria-label="목차 열기">목차</button>
      <button id="prev" aria-label="이전">←</button>
      <button id="next" aria-label="다음">→</button>
    </span>
  </div>
</div>

<div class="ov" id="ov" hidden>
  <h2>목차 — 슬라이드로 바로 가기</h2>
  <div id="ov-body"></div>
</div>

<script>
const S = [];
const add = o => S.push(o);

/* ══ 시작 ══════════════════════════════════════════ */
add({ s:0, k:"cover", n:"", t:"코덱스 바이브 코딩", sub:"2시간 × 5회 — 내 플랫폼 만들기", ttl:"표지",
  promise:"코드를 한 줄도 쓰지 않고, 10시간 뒤 인터넷에 내 사이트를 갖습니다." });

add({ s:0, k:"rows", eyebrow:"전체 지도", t:"5회 동안 무엇이 생기나", ttl:"전체 지도", rows:[
  ["1회차","<strong>배포부터 뚫는다</strong><small>인터넷에 살아있는 내 사이트 주소</small>"],
  ["2회차","<strong>말 대신 문서로 시킨다</strong><small>기획서·규칙 파일 + 목록 화면</small>"],
  ["3회차","<strong>터미널로 내려간다</strong><small>로그인 + 글 등록 기능</small>"],
  ["4회차","<strong>버그를 스스로 잡는다</strong><small>사진 업로드 + 검색 + 마이페이지</small>"],
  ["5회차","<strong>남에게 보여줄 물건으로</strong><small>완성된 플랫폼 + 3분 발표</small>"]]});

add({ s:0, k:"say", eyebrow:"이 수업의 전제", ttl:"바이브 코딩이란",
  say:"바이브 코딩은 코드를 쓰는 일이 아닙니다.<br><mark>주문하고 검수하는 일</mark>입니다.",
  cards:[["발주자","무엇을 만들지 정확히 말합니다. 코드가 아니라 요구사항을 씁니다."],
         ["감리","나온 결과가 맞는지 확인합니다. 코드를 읽지 않고 화면을 봅니다."]]});

add({ s:0, k:"checks", eyebrow:"수업 전 준비", t:"이 네 개가 로그인돼야 시작합니다", ttl:"준비물",
  checks:["<strong>GitHub</strong> — 코드가 저장되는 곳 (이메일 인증까지)",
    "<strong>ChatGPT</strong> — Codex 화면이 열리는 것까지 확인",
    "<strong>Vercel</strong> — GitHub 계정으로 가입",
    "<strong>Supabase</strong> — GitHub 계정으로 가입",
    "<strong>원페이지 공작소</strong> — web.duonedu.net"],
  warn:"넷 중 하나라도 안 되면 <b>지금 손을 드세요.</b> 수업 중에 계정을 만들면 그날 실습을 따라가기 어렵습니다." });

/* ══ 1회차 ═════════════════════════════════════════ */
add({ s:1, k:"cover", n:"1", t:"배포부터 뚫는다", sub:"1회차", ttl:"1회차 표지",
  promise:"오늘 집에 갈 때, 모두가 자기 사이트 주소를 가지고 갑니다." });

add({ s:1, k:"say", eyebrow:"왜 첫날부터 배포인가", ttl:"왜 배포부터",
  say:"대부분의 수업은 <mark>마지막 날 배포하다 끝납니다.</mark>",
  lead:"그래서 이 과정은 순서를 뒤집습니다. 오늘 만드는 건 거의 텅 빈 페이지지만, 주소는 진짜입니다. 남은 4주는 이미 뚫린 길 위에 기능만 얹습니다." });

add({ s:1, k:"rows", eyebrow:"오늘의 지도", t:"이 순서로 갑니다", ttl:"1회차 지도", step:true, rows:[
  ["1","<strong>템플릿 복제</strong> — GitHub에 내 코드 창고 만들기"],
  ["2","<strong>Vercel 연결</strong> — 인터넷 주소 받기"],
  ["3","<strong>Supabase 만들고 열쇠 넣기</strong> — 화면이 살아납니다"],
  ["4","<strong>Codex 연결하고 첫 변경</strong> — 내 서비스 이름 넣기"],
  ["5","<strong>갤러리에 등록</strong> — 4주 동안 자라는 걸 봅니다"]],
  lead:"각 단계마다 \"이렇게 보이면 성공\"이 슬라이드에 있습니다. 그게 보이면 다음으로 넘어가세요." });

const okBox = t => t ? `<div class="box-ok"><h4>✅ 이렇게 보이면 성공</h4><div>${t}</div></div>` : "";
const noBox = rows => rows && rows.length

      ([q, a]) => `<dt>${q}</dt><dd>${a}</dd>`).join("")}</dl></div>` : "";
const codeBlock = (text, cmd) =>
  `<div class="block"><button class="copy" type="button">복사</button>` +
  `<pre class="prompt${cmd ? " cmd" : ""}">${text}</pre></div>`;

function body(d) {
  switch (d.k) {
    case "cover":
      return `<div class="slide cover">${d.n ? `<span class="cover-no">${d.n}</span>` : ""}` +
why_sub(d) + `<h1>${d.t}</h1><p class="promise">${d.promise}</p></div>`;

    case "say":
      return `<p class="say">${d.say}</p>` +
        (d.lead ? `<p class="lead">${d.lead}</p>` : "") +
        (d.cards ? cards(d.cards) : "");

    case "cards2":
      return cards(d.cards);

    case "rows":
      return (d.lead ? `<p class="lead">${d.lead}</p>` : "") +
        `<div class="rows">${d.rows.map(([k, v]) =>
          `<div class="row"><span class="k${d.step ? " step" : ""}">${k}</span><span class="v">${v}</span></div>`
        ).join("")}</div>`;

    case "prompt":
      return codeBlock(d.text) + (d.lead ? `<p class="lead">${d.lead}</p>` : "");

    case "cmd":
      return (d.intro ? `<p class="lead">${d.intro}</p>` : "") + codeBlock(d.text, true) +
        `<div class="side">${okBox(d.ok)}${noBox(d.no)}</div>`;

    case "do":
      return `<div class="do two">
          <ol class="steps">${d.steps.map(s => `<li><span>${s}</span></li>`).join("")}</ol>
          <div class="side">${okBox(d.ok)}${noBox(d.no)}</div>
        </div>`;

    case "checks":
      return `<div class="checks">${d.checks.map(
        c => `<div class="check"><span class="box"></span><span>${c}</span></div>`).join("")}</div>`;
  }
  return "";
}

}

        ${(d.nAct || []).map(t => `<p class="act">▸ ${t}</p>`).join("")}
      </aside>` : "";

  stage.innerHTML = (d.k === "cover"
    ? body(d)
    : `<div class="slide">${eyebrow(d)}${d.t ? `<h2>${d.t}</h2>` : ""}${body(d)}` +
      `${d.warn ? `<p class="warn">${d.warn}</p>` : ""}</div>`)
    + (noteHtml ? `<div class="slide" style="margin-top:18px">${noteHtml}</div>` : "");

  stage.scrollTop = 0;
  countEl.textContent = `${i + 1} / ${S.length}`;
  barEl.style.width = ((i + 1) / S.length) * 100 + "%";
  pills.forEach(p => p.setAttribute("aria-current", String(+p.dataset.jump === d.s)));
  history.replaceState(null, "", "#" + (i + 1));
  updateClock();

  stage.querySelectorAll(".copy").forEach(btn => {
    btn.onclick = async () => {
      const text = btn.parentElement.querySelector("pre").textContent;
      let done = false;
      try {
        await navigator.clipboard.writeText(text);
        done = true;
      } catch {
        // 클립보드 권한이 없는 환경(일부 미리보기)에서는 옛 방식으로 시도
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.cssText = "position:fixed;opacity:0";
        document.body.appendChild(ta);
        ta.select();
        try { done = document.execCommand("copy"); } catch { done = false; }
        ta.remove();
      }
      btn.textContent = done ? "복사됨" : "직접 선택해 복사하세요";
      btn.dataset.done = done ? "1" : "";
      setTimeout(() => { btn.textContent = "복사"; btn.dataset.done = ""; }, 2200);
    };
  });
}

/* ── 강사 노트 · 진행 타이머 ─────────────────────────────
   노트는 기본 꺼짐(교실 화면에 안 보임). N 으로 켜고 끕니다.
   타이머는 T 로 시작·일시정지, Shift+T 로 0 으로 되돌립니다.
   회차를 바꾸면 그 회차 기준으로 자동으로 다시 시작합니다. */
let notesOn = false;
let running = false, startedAt = 0, accrued = 0;

const clockEl = document.getElementById("clock");
const elapsedEl = document.getElementById("elapsed");
const planEl = document.getElementById("plan");

const elapsedMs = () => accrued + (running ? Date.now() - startedAt : 0);
const mmss = ms => {
  const t = Math.max(0, Math.floor(ms / 1000));
  return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0");
};
const planMin = at => { const [h, m] = at.split(":").map(Number); return h * 60 + m; };

function updateClock() {
  const d = S[i];
  elapsedEl.textContent = mmss(elapsedMs());
  clockEl.dataset.run = running ? "1" : "0";

  if (d && d.at) {
    planEl.textContent = `· 예정 ${d.at}`;
    // 예정 시각보다 3분 넘게 늦으면 빨갛게 — 진도를 줄일 신호
    const lateBy = elapsedMs() / 60000 - planMin(d.at);
    clockEl.dataset.late = running && lateBy > 3 ? "1" : "0";
  } else {
    planEl.textContent = "";
    clockEl.dataset.late = "0";
  }
}
setInterval(updateClock, 1000);

function timerToggle() {
  if (running) { accrued = elapsedMs(); running = false; }
  else { startedAt = Date.now(); running = true; }
  updateClock();
}
function timerReset(auto) {
  accrued = 0;
  startedAt = Date.now();
  if (auto) running = true;
  updateClock();
}
function notesToggle() {
  notesOn = !notesOn;
  const el = stage.querySelector(".note");
  if (el) el.hidden = !notesOn;
  notesBtn?.setAttribute("aria-pressed", String(notesOn));
}
// 회차별 배포본에는 노트 버튼이 없다(강사 노트를 빼고 만들기 때문).
const notesBtn = document.getElementById("notes");
if (notesBtn) notesBtn.onclick = notesToggle;
clockEl.onclick = timerToggle;
clockEl.style.cursor = "pointer";
clockEl.title = "눌러서 타이머 시작·정지 (T)";

const go = n => { i = Math.max(0, Math.min(S.length - 1, n)); ov.hidden = true; render(); };
const jumpSession = s => {
  const f = S.findIndex(x => x.s === s);
  if (f < 0) return;
  // 회차를 바꾸면 그 회차 기준으로 타이머를 다시 시작한다.
  if (s >= 1 && S[i].s !== s) timerReset(true);
  go(f);
};

document.getElementById("prev").onclick = () => go(i - 1);
document.getElementById("next").onclick = () => go(i + 1);
pills.forEach(p => p.onclick = () => jumpSession(+p.dataset.jump));

/* 목차 */
function buildOverview() {
  const groups = [...new Set(S.map(x => x.s))];
  document.getElementById("ov-body").innerHTML = groups.map(g => {
    const items = S.map((x, n) => ({ x, n })).filter(o => o.x.s === g);
    return `<div class="ov-group"><h3>${SESSION_NAME[g]}</h3><div class="ov-list">${
      items.map(o => `<button class="ov-item" data-go="${o.n}"><span>${o.n + 1}</span>` +
        `<span style="color:var(--fg)">${o.x.ttl || o.x.t || ""}</span></button>`).join("")}</div></div>`;
  }).join("");
  ov.querySelectorAll(".ov-item").forEach(b => b.onclick = () => go(+b.dataset.go));
}
const toggleOv = () => {
  ov.hidden = !ov.hidden;
  if (!ov.hidden) ov.scrollTop = 0;
};
document.getElementById("toc").onclick = toggleOv;

addEventListener("keydown", e => {
  if (e.target.closest("button") && e.key === " ") return;
  if (e.key === "Escape") { ov.hidden = true; return; }
  if (e.key === "o" || e.key === "O" || e.key === "ㅐ") { e.preventDefault(); toggleOv(); return; }
  if (e.key === "n" || e.key === "N" || e.key === "ㅜ") { e.preventDefault(); notesToggle(); return; }
  if (e.key === "T") { e.preventDefault(); timerReset(false); running = false; updateClock(); return; }
  if (e.key === "t" || e.key === "ㅅ") { e.preventDefault(); timerToggle(); return; }
  if (!ov.hidden) return;
  if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); go(i + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(i - 1); }
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(S.length - 1);
  else if (/^[0-5]$/.test(e.key)) jumpSession(+e.key);
});

buildOverview();
const start = parseInt(location.hash.slice(1), 10);
go(Number.isFinite(start) && start > 0 ? start - 1 : 0);
</script>
